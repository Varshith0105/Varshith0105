# GitHub Metrics (lowlighter/metrics) — https://github.com/lowlighter/metrics
# Requires repo secret METRICS_TOKEN (classic PAT, scopes: read:user + public_repo). See docs/SETUP.md.
name: GitHub Metrics
on:
  schedule:
    - cron: "0 3 * * *"   # daily, 03:00 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metrics
  cancel-in-progress: true
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Classic overview + languages + achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: "chore(metrics): update ${filename} [skip ci]"
          user: Varshith0105
          filename: metrics/metrics.classic.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: large
          plugin_languages: yes
          plugin_languages_ignored: html, css, jupyter notebook
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          plugin_achievements_secrets: no

      - name: Isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: "chore(metrics): update ${filename} [skip ci]"
          user: Varshith0105
          filename: metrics/metrics.isocalendar.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
