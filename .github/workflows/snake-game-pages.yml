name: Deploy Snake Quest Game

on:
  push:
    branches: [main]
    paths:
      - "snake-game/**"
      - ".github/workflows/snake-game-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Snake Quest site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "snake-game"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
