<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="535" viewBox="0 0 1280 535" role="img" aria-labelledby="t d">
<title id="t">Developer and off-the-clock editorial scene</title><desc id="d">Two cinematic editorial panels outline Varshith's engineering practice and life beyond the keyboard.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080710"/><stop offset="1" stop-color="#120B1F"/></linearGradient><linearGradient id="pink" x2="1"><stop stop-color="#F472B6"/><stop offset="1" stop-color="#A855F7"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="26"/></filter><pattern id="lines" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M0 28L28 0" stroke="#fff" stroke-opacity=".035"/></pattern><style>text{font-family:Arial,Helvetica,sans-serif}.m{font-family:'Courier New',monospace;letter-spacing:2px}.label{fill:#f9a8d4;font-size:12px}.copy{fill:#bea9c5;font-size:16px}.pill{fill:#17101f;stroke:#6f396a}.pilltext{fill:#f5d8eb;font-size:12px}</style></defs>
<rect width="1280" height="535" rx="28" fill="url(#bg)"/><rect width="1280" height="535" rx="28" fill="url(#lines)"/><text x="64" y="67" class="m label">// TWO SIDES OF THE STORY</text><text x="64" y="108" fill="#fff7fd" font-size="28" font-weight="700">The work. The curiosity. The human behind it.</text>
<g transform="translate(64 145)"><rect width="550" height="326" rx="22" fill="#100b19" stroke="#7f3f7b"/><circle cx="440" cy="95" r="155" fill="#EC4899" opacity=".17" filter="url(#blur)"/><path d="M0 259Q130 200 278 274T550 242V326H0Z" fill="#0b0910"/><path d="M0 258Q130 199 278 273T550 241" fill="none" stroke="url(#pink)" stroke-opacity=".55"/><text x="34" y="48" class="m label">01 / DEVELOPER</text><text x="34" y="98" fill="#fff7fd" font-size="34" font-weight="700">WHAT I BUILD</text><text x="34" y="131" class="copy">Intelligent products where research, design,</text><text x="34" y="153" class="copy">and reliable engineering meet.</text><g transform="translate(34 190)"><rect class="pill" width="92" height="34" rx="17"/><text x="18" y="22" class="m pilltext">AI / ML</text><rect class="pill" x="104" width="133" height="34" rx="17"/><text x="123" y="22" class="m pilltext">GEN AI</text><rect class="pill" x="249" width="138" height="34" rx="17"/><text x="268" y="22" class="m pilltext">AI AGENTS</text><rect class="pill" y="47" width="132" height="34" rx="17"/><text x="19" y="69" class="m pilltext">FULL STACK</text><rect class="pill" x="144" y="47" width="163" height="34" rx="17"/><text x="164" y="69" class="m pilltext">DEEP LEARNING</text></g><g transform="translate(410 165)" fill="none" stroke="url(#pink)"><circle cx="65" cy="52" r="54" stroke-opacity=".7"/><circle cx="65" cy="52" r="31" stroke-opacity=".4"/><path d="M65 0v104M13 52h104M28 15l74 74M102 15L28 89" stroke-opacity=".35"/><circle cx="65" cy="52" r="8" fill="#F472B6"/></g></g>
<g transform="translate(666 145)"><rect width="550" height="326" rx="22" fill="#100b19" stroke="#63467c"/><circle cx="103" cy="93" r="150" fill="#A855F7" opacity=".16" filter="url(#blur)"/><path d="M0 278Q155 226 306 271T550 249V326H0Z" fill="#0b0910"/><path d="M0 277Q155 225 306 270T550 248" fill="none" stroke="url(#pink)" stroke-opacity=".5"/><text x="34" y="48" class="m" fill="#d9c1ff" font-size="12">02 / OFF THE CLOCK</text><text x="34" y="98" fill="#fff7fd" font-size="34" font-weight="700">STAYING CURIOUS</text><text x="34" y="131" class="copy">Learning in public, moving often,</text><text x="34" y="153" class="copy">and collecting perspective beyond the screen.</text><g transform="translate(34 190)"><rect class="pill" width="118" height="34" rx="17"/><text x="20" y="22" class="m pilltext">LEARNING</text><rect class="pill" x="130" width="137" height="34" rx="17"/><text x="150" y="22" class="m pilltext">TECHNOLOGY</text><rect class="pill" x="279" width="108" height="34" rx="17"/><text x="300" y="22" class="m pilltext">FITNESS</text><rect class="pill" y="47" width="92" height="34" rx="17"/><text x="19" y="69" class="m pilltext">TRAVEL</text><rect class="pill" x="104" y="47" width="134" height="34" rx="17"/><text x="123" y="69" class="m pilltext">EXPLORE</text></g><g transform="translate(414 161)" fill="none" stroke="url(#pink)"><circle cx="60" cy="60" r="59" stroke-opacity=".65"/><path d="M60 1C35 29 35 91 60 119C85 91 85 29 60 1M1 60C30 38 90 38 119 60C90 82 30 82 1 60" stroke-opacity=".48"/><circle cx="60" cy="60" r="8" fill="#C084FC"/></g></g><rect width="1280" height="535" rx="28" fill="none" stroke="#A855F7" stroke-opacity=".42"/>
</svg>
