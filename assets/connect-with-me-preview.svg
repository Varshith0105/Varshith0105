<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">Connect With Me message terminal</title><desc id="desc">Dark hacker-style contact box with green border, online status, name and optional email fields, message area and send message button. Click to open the interactive form.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#050907"/><stop offset="1" stop-color="#020403"/></linearGradient><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#39ff78" stroke-opacity=".035"/></pattern></defs>
<rect x="1" y="1" width="898" height="388" rx="15" fill="url(#bg)" stroke="#176b35" stroke-width="1.5"/><rect x="2" y="2" width="896" height="386" rx="14" fill="url(#grid)"/>
