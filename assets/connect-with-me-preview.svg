<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<title id="title">Connect with Varshith</title><desc id="desc">A neon-green message terminal on the left and a friendly waving robot on the right. Click to open the contact form.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050907"/><stop offset="1" stop-color="#0b1710"/></linearGradient><linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b180f"/><stop offset="1" stop-color="#030704"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#39ff78" stroke-opacity=".055"/></pattern></defs>
<rect x="1" y="1" width="898" height="328" rx="16" fill="url(#bg)" stroke="#176b35" stroke-width="1.5"/><rect x="2" y="2" width="896" height="326" rx="15" fill="url(#grid)"/>
<!-- laptop/message screen -->
<rect x="30" y="24" width="530" height="258" rx="13" fill="url(#screen)" stroke="#39ff78" stroke-width="1.6"/>
<path d="M43 24H547Q560 24 560 37V52H30V37Q30 24 43 24Z" fill="#0a1b10"/>
<circle cx="47" cy="38" r="4" fill="#ff6058"/><circle cx="61" cy="38" r="4" fill="#ffbd2e"/><circle cx="75" cy="38" r="4" fill="#39d353"/>
<text x="295" y="41" text-anchor="middle" fill="#8dffae" font-family="monospace" font-size="11">visitor@github: ~/contact</text>
<text x="52" y="75" fill="#39ff78" font-family="monospace" font-size="14" font-weight="bold">$ ./send-message.sh</text>
<text x="52" y="94" fill="#8aa997" font-family="monospace" font-size="10">Tell me what you're building.</text>
<text x="52" y="119" fill="#b5d7c0" font-family="monospace" font-size="10">YOUR NAME</text><rect x="52" y="126" width="220" height="27" rx="5" fill="#030704" stroke="#245334"/><text x="62" y="143" fill="#597663" font-family="monospace" font-size="10">Enter your name...</text>
<text x="288" y="119" fill="#b5d7c0" font-family="monospace" font-size="10">YOUR EMAIL</text><rect x="288" y="126" width="242" height="27" rx="5" fill="#030704" stroke="#245334"/><text x="298" y="143" fill="#597663" font-family="monospace" font-size="10">you@example.com</text>
<text x="52" y="174" fill="#b5d7c0" font-family="monospace" font-size="10">MESSAGE</text><rect x="52" y="181" width="478" height="49" rx="5" fill="#030704" stroke="#245334"/><text x="62" y="198" fill="#597663" font-family="monospace" font-size="10">Hi Varshith, I'd like to talk about...</text><path d="M62 209H175" stroke="#39ff78" stroke-width="1" opacity=".55"/>
<rect x="52" y="242" width="158" height="25" rx="5" fill="#39ff78"/><text x="131" y="258" text-anchor="middle" fill="#041008" font-family="monospace" font-size="11" font-weight="bold">➤ SEND MESSAGE</text>
<!-- robot -->
<g transform="translate(625 18)" stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="112" cy="283" rx="75" ry="9" fill="#39ff78" opacity=".10"/>
<!-- antenna -->
<path d="M119 53V35" stroke="#39ff78" stroke-width="5"/><circle cx="119" cy="26" r="9" fill="#39ff78" filter="url(#glow)"><animate attributeName="opacity" values="1;.5;1" dur="1.7s" repeatCount="indefinite"/></circle>
<!-- waving arm -->
<path d="M174 132Q208 118 223 84L244 56" fill="none" stroke="#39ff78" stroke-width="17"/><circle cx="247" cy="51" r="13" fill="#102b19" stroke="#39ff78" stroke-width="3"/>
<path d="M241 41l-5-13m13 11 2-14m5 19 11-9" stroke="#39ff78" stroke-width="4"/>
<!-- other arm -->
<path d="M61 137L34 161L18 149" fill="none" stroke="#39ff78" stroke-width="15"/><circle cx="15" cy="147" r="9" fill="#102b19" stroke="#39ff78" stroke-width="3"/>
<!-- legs -->
<path d="M91 222L80 260" stroke="#39ff78" stroke-width="18"/><path d="M143 222L158 258" stroke="#39ff78" stroke-width="18"/><path d="M65 264h24M146 264h25" stroke="#39ff78" stroke-width="8"/>
<!-- body/head -->
<rect x="55" y="104" width="120" height="122" rx="31" fill="#0b180f" stroke="#39ff78" stroke-width="3" filter="url(#glow)"/>
<rect x="66" y="115" width="98" height="67" rx="19" fill="#020704" stroke="#1a6333" stroke-width="2"/>
<ellipse cx="92" cy="143" rx="8" ry="11" fill="#39ff78"><animate attributeName="ry" values="11;11;1;11;11" keyTimes="0;.46;.48;.5;1" dur="4s" repeatCount="indefinite"/></ellipse><ellipse cx="138" cy="143" rx="8" ry="11" fill="#39ff78"><animate attributeName="ry" values="11;11;1;11;11" keyTimes="0;.46;.48;.5;1" dur="4s" repeatCount="indefinite"/></ellipse>
<path d="M94 163Q115 178 137 163" fill="none" stroke="#39ff78" stroke-width="3"/>
<rect x="82" y="192" width="67" height="19" rx="7" fill="#102b19" stroke="#39ff78" stroke-width="1.5"/><circle cx="97" cy="201" r="3" fill="#39ff78"/><circle cx="115" cy="201" r="3" fill="#39ff78"/><circle cx="133" cy="201" r="3" fill="#39ff78"/>
</g>
<text x="735" y="316" text-anchor="middle" fill="#39ff78" font-family="monospace" font-size="12">YOUR MESSAGE, MY NEXT MOVE →</text>
</svg>