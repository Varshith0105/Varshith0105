<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750" role="img" aria-labelledby="t d">
<title id="t">Featured builds by Varshith Julakanti</title><desc id="d">Five cinematic project cards: AI-Powered Drug Discovery, Personal AI Chat, StockAI, Semantic Search System, and Skin Disease Prediction.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080710"/><stop offset="1" stop-color="#160a22"/></linearGradient><linearGradient id="n" x2="1"><stop stop-color="#F472B6"/><stop offset="1" stop-color="#A855F7"/></linearGradient><filter id="b"><feGaussianBlur stdDeviation="18"/></filter><style>text{font-family:Arial,Helvetica,sans-serif}.m{font-family:'Courier New',monospace;letter-spacing:1.5px}.tag{font-family:'Courier New',monospace;fill:#e8d7e9;font-size:10px}.small{fill:#bea9c4;font-size:13px}.card{fill:#120d1a;stroke:#5f375e;stroke-width:1.1}.accent{fill:url(#n)}.num{fill:#f9a8d4;font-family:'Courier New',monospace;font-size:11px}</style></defs>
<rect width="1280" height="750" rx="28" fill="url(#bg)"/><circle cx="1040" cy="130" r="220" fill="#A855F7" opacity=".13" filter="url(#b)"/><circle cx="180" cy="610" r="200" fill="#EC4899" opacity=".12" filter="url(#b)"/><text x="64" y="67" class="m" fill="#F9A8D4" font-size="13">// SELECTED WORK</text><text x="64" y="108" fill="#fff7fd" font-size="31" font-weight="700">Featured builds</text><text x="64" y="136" fill="#bda9c3" font-size="15">Applied AI explorations made to predict, retrieve, converse, and classify.</text>
<g transform="translate(64 174)"><rect class="card" width="560" height="194" rx="19"/><rect class="accent" width="6" height="194" rx="3"/><text x="30" y="35" class="num">01 / COMPUTATIONAL BIOLOGY</text><text x="30" y="76" fill="#fff4fc" font-size="26" font-weight="700">AI-Powered Drug Discovery</text><text x="30" y="104" class="small">Drug-target interaction prediction with CNN models</text><text x="30" y="123" class="small">and explainable AI.</text><g transform="translate(30 144)"><rect width="62" height="28" rx="14" fill="#2b1530"/><text x="14" y="19" class="tag">PYTHON</text><rect x="72" width="46" height="28" rx="14" fill="#2b1530"/><text x="86" y="19" class="tag">CNN</text><rect x="128" width="50" height="28" rx="14" fill="#2b1530"/><text x="142" y="19" class="tag">XAI</text></g><path d="M499 31h31M515 15v32" stroke="#F472B6" stroke-width="2"/><g transform="translate(453 113)" fill="none" stroke="#C084FC" stroke-opacity=".6"><circle cx="34" cy="31" r="27"/><circle cx="34" cy="31" r="9"/><path d="M4 31h60M34 1v60"/></g></g>
<g transform="translate(656 174)"><rect class="card" width="560" height="194" rx="19"/><rect class="accent" width="6" height="194" rx="3"/><text x="30" y="35" class="num">02 / CONVERSATIONAL AI</text><text x="30" y="76" fill="#fff4fc" font-size="26" font-weight="700">Personal AI Chat</text><text x="30" y="104" class="small">Real-time conversations with context memory</text><text x="30" y="123" class="small">and streaming responses.</text><g transform="translate(30 144)"><rect width="64" height="28" rx="14" fill="#2b1530"/><text x="14" y="19" class="tag">NEXT.JS</text><rect x="74" width="82" height="28" rx="14" fill="#2b1530"/><text x="87" y="19" class="tag">TYPESCRIPT</text><rect x="166" width="63" height="28" rx="14" fill="#2b1530"/><text x="179" y="19" class="tag">OPENAI</text></g><path d="M499 31h31M515 15v32" stroke="#C084FC" stroke-width="2"/><path d="M478 122q37-34 74 0t-74 0" fill="none" stroke="#C084FC" stroke-opacity=".65"/><circle cx="515" cy="121" r="7" fill="#F472B6"/></g>
<g transform="translate(64 400)"><rect class="card" width="360" height="246" rx="19"/><rect class="accent" width="6" height="246" rx="3"/><text x="29" y="35" class="num">03 / FINTECH</text><text x="29" y="76" fill="#fff4fc" font-size="24" font-weight="700">StockAI</text><text x="29" y="104" class="small">LSTM market forecasting with</text><text x="29" y="123" class="small">visual analytics.</text><path d="M29 166l42-24 34 17 45-57 43 20 46-43 54 30" fill="none" stroke="url(#n)" stroke-width="3"/><g transform="translate(29 192)"><rect width="52" height="28" rx="14" fill="#2b1530"/><text x="42" y="19" class="tag">LSTM</text><rect x="62" width="62" height="28" rx="14" fill="#2b1530"/><text x="76" y="19" class="tag">PYTHON</text></g></g>
<g transform="translate(460 400)"><rect class="card" width="360" height="246" rx="19"/><rect class="accent" width="6" height="246" rx="3"/><text x="29" y="35" class="num">04 / RETRIEVAL</text><text x="29" y="76" fill="#fff4fc" font-size="24" font-weight="700">Semantic Search</text><text x="29" y="104" class="small">RAG retrieval with embeddings,</text><text x="29" y="123" class="small">cache, and vector databases.</text><g transform="translate(29 145)" fill="none" stroke="#C084FC" stroke-opacity=".7"><circle cx="27" cy="27" r="19"/><path d="M42 42l21 21" stroke-width="4"/><path d="M86 18h136M86 42h104M86 66h119"/></g><g transform="translate(29 192)"><rect width="44" height="28" rx="14" fill="#2b1530"/><text x="41" y="19" class="tag">RAG</text><rect x="54" width="76" height="28" rx="14" fill="#2b1530"/><text x="68" y="19" class="tag">FASTAPI</text></g></g>
<g transform="translate(856 400)"><rect class="card" width="360" height="246" rx="19"/><rect class="accent" width="6" height="246" rx="3"/><text x="29" y="35" class="num">05 / COMPUTER VISION</text><text x="29" y="76" fill="#fff4fc" font-size="23" font-weight="700">Skin Disease Prediction</text><text x="29" y="104" class="small">CNN classification across</text><text x="29" y="123" class="small">seven disease classes.</text><g transform="translate(29 145)" fill="none" stroke="#F472B6" stroke-opacity=".7"><rect width="80" height="54" rx="8"/><circle cx="25" cy="21" r="8"/><path d="M7 47l23-20 16 13 12-11 16 18"/></g><g transform="translate(29 192)"><rect width="62" height="28" rx="14" fill="#2b1530"/><text x="42" y="19" class="tag">PYTHON</text><rect x="72" width="90" height="28" rx="14" fill="#2b1530"/><text x="85" y="19" class="tag">TENSORFLOW</text></g></g><rect width="1280" height="750" rx="28" fill="none" stroke="#A855F7" stroke-opacity=".42"/>
</svg>
