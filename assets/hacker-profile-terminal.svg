<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img" aria-labelledby="title desc">
<title id="title">Varshith's continuously typing hacker terminal</title>
<desc id="desc">A looping green terminal that continuously types developer jokes and hobbies.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#020604"/><stop offset="1" stop-color="#050b07"/></linearGradient>
 <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#00ff66" stroke-opacity=".045"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="1.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="jokeClip"><rect x="22" y="126" width="0" height="13"><animate attributeName="width" values="0;340;340;0" keyTimes="0;.22;.82;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
 <clipPath id="hobbyClip"><rect x="22" y="258" width="0" height="13"><animate attributeName="width" values="0;330;330;0" keyTimes="0;.22;.82;1" dur="7s" begin="3.5s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<rect width="800" height="390" rx="10" fill="url(#bg)" stroke="#0b7a35" stroke-width="1.4"/>
<rect width="800" height="390" rx="10" fill="url(#grid)"/>
<path d="M10 0H790Q800 0 800 10V28H0V10Q0 0 10 0Z" fill="#07150b"/>
<circle cx="17" cy="14" r="4" fill="#ff5f56"/><circle cx="31" cy="14" r="4" fill="#ffbd2e"/><circle cx="45" cy="14" r="4" fill="#27c93f"/>
<text x="400" y="18" text-anchor="middle" fill="#49ff8a" font-family="monospace" font-size="10">varshith@github: ~/life — terminal</text>
<style>
.code{font-family:Consolas,Monaco,monospace;font-size:10.5px;fill:#39ff78}
.prompt{font-family:Consolas,Monaco,monospace;font-size:10.5px;fill:#9bffb8;font-weight:700;filter:url(#glow)}
</style>
<text x="18" y="44" class="prompt">┌──(varshith㉿github)-[~/life]</text>
<text x="18" y="57" class="prompt">└─$ ./daily-routine.sh</text>
<text x="18" y="78" class="code">[ OK ] Booting developer mode...</text>
<text x="18" y="91" class="code">[ OK ] Loading questionable debugging skills...</text>
<text x="18" y="111" class="prompt">┌─ TECH JOKES // live feed</text>
<text x="18" y="126" class="code" clip-path="url(#jokeClip)">├─ It works on my machine. Ship the machine.</text>
<text x="18" y="143" class="code" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.2;.22;.82;1" dur="7s" repeatCount="indefinite"/>├─ 99 bugs in the code, patch one… now 127.</text>
<text x="18" y="160" class="code" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.2;.22;.82;1" dur="7s" begin="7s" repeatCount="indefinite"/>├─ Git commit: 'fixed it'  |  Git diff: 847 lines</text>
<text x="18" y="177" class="code" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.2;.22;.82;1" dur="7s" begin="14s" repeatCount="indefinite"/>└─ 404: Sleep not found</text>
<text x="18" y="204" class="prompt">┌─ HOBBIES // rotating status</text>
<text x="18" y="221" class="code">├─ ♟ Chess: calculating 12 moves ahead</text>
<text x="18" y="238" class="code">├─ 🌿 Nature: touch grass, clear cache</text>
<text x="18" y="255" class="code">└─ 🏍 Solo rides: no meetings, just miles</text>
<text x="18" y="276" class="code" clip-path="url(#hobbyClip)">[ NOW ] Recharging: coffee++ ; focus.restore()</text>
<text x="18" y="303" class="prompt">┌─ STRESS_HANDLER.exe</text>
<text x="18" y="320" class="prompt">└─ if (stressed) { coffee++; retry(); }</text>
<text x="18" y="347" class="code">[ STATUS ] Typing jokes &amp; hobbies…</text>
<text x="18" y="367" class="code">[ LOOP ] refresh(); laugh(); repeat();</text>
<rect x="18" y="375" width="7" height="10" fill="#39ff78"><animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></rect>
</svg>