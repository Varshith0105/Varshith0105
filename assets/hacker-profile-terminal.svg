<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">Varshith's compact animated terminal</title>
<desc id="desc">A compact green-on-black terminal with smooth typewriter lines about coding jokes, chess, nature breaks, solo rides, and coffee.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#030906"/><stop offset="1" stop-color="#06110a"/></linearGradient>
  <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#20ff70" stroke-opacity=".035"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation=".65" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="line0"><rect x="22" y="69" width="0" height="15"><animate attributeName="width" values="0;345;345;0" keyTimes="0;.12;.91;1" dur="13s" begin="0s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="line1"><rect x="22" y="88" width="0" height="15"><animate attributeName="width" values="0;360;360;0" keyTimes="0;.12;.91;1" dur="13s" begin="0.7s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="line2"><rect x="22" y="107" width="0" height="15"><animate attributeName="width" values="0;340;340;0" keyTimes="0;.12;.91;1" dur="13s" begin="1.4s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="line3"><rect x="22" y="126" width="0" height="15"><animate attributeName="width" values="0;330;330;0" keyTimes="0;.12;.91;1" dur="13s" begin="2.1s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="line4"><rect x="22" y="145" width="0" height="15"><animate attributeName="width" values="0;345;345;0" keyTimes="0;.12;.91;1" dur="13s" begin="2.8s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="line5"><rect x="22" y="164" width="0" height="15"><animate attributeName="width" values="0;360;360;0" keyTimes="0;.12;.91;1" dur="13s" begin="3.5s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="line6"><rect x="22" y="183" width="0" height="15"><animate attributeName="width" values="0;350;350;0" keyTimes="0;.12;.91;1" dur="13s" begin="4.2s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="line7"><rect x="22" y="202" width="0" height="15"><animate attributeName="width" values="0;350;350;0" keyTimes="0;.12;.91;1" dur="13s" begin="4.9s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="line8"><rect x="22" y="221" width="0" height="15"><animate attributeName="width" values="0;350;350;0" keyTimes="0;.12;.91;1" dur="13s" begin="5.6s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="line9"><rect x="22" y="240" width="0" height="15"><animate attributeName="width" values="0;345;345;0" keyTimes="0;.12;.91;1" dur="13s" begin="6.3s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<rect x=".7" y=".7" width="758.6" height="298.6" rx="10" fill="url(#bg)" stroke="#087a39" stroke-width="1.4"/>
<rect x="1" y="1" width="758" height="298" rx="10" fill="url(#grid)"/>
<path d="M11 1H749Q759 1 759 11V29H1V11Q1 1 11 1Z" fill="#07170d"/>
<circle cx="17" cy="15" r="4" fill="#ff5f56"/><circle cx="31" cy="15" r="4" fill="#ffbd2e"/><circle cx="45" cy="15" r="4" fill="#27c93f"/>
<text x="380" y="19" text-anchor="middle" fill="#64ffa0" font-family="Consolas,Monaco,monospace" font-size="10">varshith@github: ~/life — terminal</text>
<style>
  .code{font-family:Consolas,Monaco,monospace;font-size:11px;fill:#42ff82}
  .prompt{font-family:Consolas,Monaco,monospace;font-size:11px;fill:#a4ffc0;font-weight:700;filter:url(#glow)}
  .dim{font-family:Consolas,Monaco,monospace;font-size:10px;fill:#64c987}
</style>
<text x="18" y="48" class="prompt">┌─(varshith㉿github)-[~/life]</text>
<text x="18" y="62" class="prompt">└─$ ./daily-routine.sh</text>
<text x="22" y="80" class="code" clip-path="url(#line0)">[ OK ] Booting developer mode...</text>
<text x="22" y="99" class="code" clip-path="url(#line1)">[ OK ] Loading questionable debugging skills...</text>
<text x="22" y="118" class="prompt" clip-path="url(#line2)">┌─ TECH JOKES // live feed</text>
<text x="22" y="137" class="code" clip-path="url(#line3)">├─ It works on my machine. Ship the machine.</text>
<text x="22" y="156" class="code" clip-path="url(#line4)">├─ Git commit: "fixed it"  |  Git diff: 847 lines</text>
<text x="22" y="175" class="prompt" clip-path="url(#line5)">┌─ HOBBIES // rotating status</text>
<text x="22" y="194" class="code" clip-path="url(#line6)">├─ ♟ Chess: calculating 12 moves ahead</text>
<text x="22" y="213" class="code" clip-path="url(#line7)">├─ 🌿 Nature: touch grass, clear cache</text>
<text x="22" y="232" class="code" clip-path="url(#line8)">└─ 🏍 Solo rides: no meetings, just miles</text>
<text x="22" y="251" class="code" clip-path="url(#line9)">[ STATUS ] if (stressed) { coffee++; retry(); }</text>
<text x="22" y="278" class="dim">[ LOOP ] type(); debug(); recharge(); repeat();</text>
<rect x="22" y="285" width="6" height="8" fill="#42ff82"><animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></rect>
</svg>