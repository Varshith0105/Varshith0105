<g transform="translate(66 165)"><text class="m" fill="#F9A8D4" font-size="14">// HELLO, WORLD</text><text y="64" fill="#fff8fd" font-size="48" font-weight="700">I'M VARSHITH</text><text y="119" fill="url(#n)" font-size="48" font-weight="700">JULAKANTI.</text><text y="160" fill="#e2cbe7" font-size="18">AI/ML Engineer · Generative AI Developer · AI Agent Builder</text><text y="193" fill="#ad92b6" font-size="15">I build intelligent systems and cinematic digital experiences.</text><g transform="translate(0 236)"><rect width="168" height="38" rx="19" fill="#2b112c" stroke="#EC4899"/><text x="22" y="25" class="m" fill="#ffd1e9" font-size="11">AI / ML</text><rect x="181" width="188" height="38" rx="19" fill="#1f102e" stroke="#A855F7"/><text x="203" y="25" class="m" fill="#ead6ff" font-size="11">GEN AI</text><rect x="382" width="166" height="38" rx="19" fill="#2b112c" stroke="#F472B6"/><text x="402" y="25" class="m" fill="#ffd1e9" font-size="11">AI AGENTS</text></g></g>
