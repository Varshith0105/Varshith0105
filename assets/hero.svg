<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">Varshith Julakanti — cinematic developer introduction</title>
  <desc id="desc">An illustrated developer walks into a pink and purple cinematic frame, slows, stops, turns, waves hello, and idles.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#050307"/><stop offset=".52" stop-color="#140719"/><stop offset="1" stop-color="#09020d"/></linearGradient>
    <linearGradient id="neon" x2="1"><stop stop-color="#ff4fa3"/><stop offset=".52" stop-color="#d946ef"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#f472b6" stop-opacity=".42"/><stop offset=".55" stop-color="#a855f7" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#d946ef" stroke-opacity=".12"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="portrait"><rect width="294" height="390" rx="147"/></clipPath>
    <style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'Courier New',monospace;letter-spacing:2px}.hud{fill:#f4d8ff;font-size:12px}.faint{fill:#a88bb8;font-size:11px}@media (prefers-reduced-motion:reduce){animate,animateTransform{display:none}}</style>
  </defs>
  <rect width="1280" height="600" rx="26" fill="url(#sky)"/><rect width="1280" height="600" rx="26" fill="url(#grid)"/><circle cx="930" cy="306" r="340" fill="url(#halo)" filter="url(#blur)"/>
  <path d="M0 510C190 466 370 548 566 492S944 430 1280 505V600H0Z" fill="#09040d"/><path d="M0 516C210 468 368 552 570 497S950 439 1280 510" fill="none" stroke="url(#neon)" stroke-opacity=".38" stroke-width="2"/>
  <g fill="none" stroke="url(#neon)" stroke-width="2" opacity=".88"><path d="M34 72V34H72M1208 34h38v38M34 528v38h38M1208 566h38v-38"/><path d="M95 92h122M1063 92h122" stroke-opacity=".46"/></g>
  <g class="mono"><text x="66" y="72" fill="#ff8ec7" font-size="13">REC • 01</text><circle cx="146" cy="67" r="4" fill="#ff3b93"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></circle><text x="66" y="106" class="faint">VARSHITH.J / CAMERA A</text><text x="66" y="492" class="faint">TIME CODE 00:00:18:00</text><text x="1018" y="532" class="faint">FRAME / 16:9</text></g>
  <g transform="translate(66 173)"><text class="mono" fill="#ff9ccd" font-size="14">// HELLO, WORLD</text><text y="59" fill="#fff6fc" font-size="43" font-weight="700">I build intelligent</text><text y="109" fill="url(#neon)" font-size="43" font-weight="700">experiences.</text><text y="155" fill="#c5abc9" font-size="17">AI/ML Engineer · Generative AI Developer · AI Agent Builder</text><g transform="translate(0 199)" class="mono" font-size="12"><rect width="144" height="32" rx="16" fill="#2a1029" stroke="#ff4fa3" stroke-opacity=".6"/><text x="19" y="21" fill="#ffc2e3">AI / ML</text><rect x="156" width="166" height="32" rx="16" fill="#1d102d" stroke="#c084fc" stroke-opacity=".6"/><text x="176" y="21" fill="#dec4ff">GEN AI</text><rect x="334" width="154" height="32" rx="16" fill="#281020" stroke="#f0abfc" stroke-opacity=".6"/><text x="354" y="21" fill="#ffc4ed">AI AGENTS</text></g></g>
  <g transform="translate(66 395)" class="mono" font-size="12"><text fill="#a98cb7">SEQUENCE</text><text x="0" y="25" fill="#ff9dcd">WALK → SLOW → STOP → TURN → RAISE HAND → WAVE → HI → IDLE</text><rect y="44" width="492" height="3" rx="2" fill="#35142f"/><rect y="44" width="0" height="3" rx="2" fill="url(#neon)"><animate attributeName="width" values="0;160;250;330;410;492;492" keyTimes="0;.28;.42;.5;.57;.72;1" dur="18s" repeatCount="indefinite"/></rect></g>
  <g transform="translate(884 92)"><rect x="-22" y="-18" width="350" height="455" rx="28" fill="#110612" stroke="#f472b6" stroke-opacity=".38"/><rect x="-14" y="-10" width="334" height="439" rx="22" fill="#050308" stroke="url(#neon)" stroke-opacity=".7"/><path d="M0 400h306" stroke="url(#neon)" stroke-opacity=".55"/>
    <g id="walk-cycle" transform="translate(510 1)"><animateTransform attributeName="transform" type="translate" values="510 1;190 1;64 1;25 1;0 1;0 1;0 1" keyTimes="0;.28;.42;.5;.57;.72;1" dur="18s" repeatCount="indefinite"/><g transform="translate(0 8)"><image href="avatar/varshith-illustrated.png" xlink:href="avatar/varshith-illustrated.png" width="294" height="390" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/><rect width="294" height="390" rx="147" fill="none" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/><g transform="translate(232 211)" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;1;1;1" keyTimes="0;.42;.5;.55;.57;.72;.78;1" dur="18s" repeatCount="indefinite"/><g transform="rotate(-52)"><animateTransform attributeName="transform" type="rotate" values="-52;-52;-8;-8;-52;-8;-52" keyTimes="0;.55;.60;.65;.70;.75;1" dur="18s" repeatCount="indefinite"/><path d="M0 116L0 24" stroke="#f6b08c" stroke-width="22" stroke-linecap="round"/><circle cy="14" r="24" fill="#f6b08c"/><path d="M-16 2L-29-14M-5-6L-7-27M8-5L18-25M18 5L34-7" stroke="#f6b08c" stroke-width="7" stroke-linecap="round"/></g></g></g></g>
    <g class="mono"><text x="13" y="-35" fill="#ffabd5" font-size="11">SUBJECT / TRACKING</text><text x="12" y="422" fill="#cca9db" font-size="10">ILLUSTRATED DEVELOPER AVATAR</text></g>
  </g>
  <g class="mono" opacity="0"><animate attributeName="opacity" values="0;0;0;1;1;1;1;0" keyTimes="0;.42;.5;.57;.70;.78;.92;1" dur="18s" repeatCount="indefinite"/><text x="1016" y="126" fill="#fff0fa" font-size="34">HI</text><text x="1019" y="147" fill="#ff9dcd" font-size="10">NICE TO MEET YOU</text></g><rect x="0" y="0" width="1280" height="600" rx="26" fill="none" stroke="#a855f7" stroke-opacity=".45"/>
