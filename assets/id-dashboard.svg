<g class="id"><path d="M298 0V74M298 0L165 89L240 165M298 0L431 89L356 165" fill="none" stroke="#94748f" stroke-width="7"/><rect x="274" y="64" width="48" height="40" rx="9" fill="#dfcae0" stroke="#fff" stroke-opacity=".5"/><rect x="132" y="141" width="332" height="405" rx="23" fill="#f9f4fa" stroke="url(#n)" stroke-width="3"/><rect x="149" y="158" width="298" height="53" rx="13" fill="#170d22"/><text x="172" y="190" class="m" fill="#ffd1e9" font-size="12">VARSHITH // ACCESS</text><rect x="166" y="234" width="119" height="151" rx="10" fill="#160d1c"/><image href="avatar/varshith-id-photo.png" xlink:href="avatar/varshith-id-photo.png" x="166" y="234" width="119" height="151" preserveAspectRatio="xMidYMid slice"/><rect x="300" y="238" width="119" height="25" rx="12" fill="#ead4ff"/><text x="315" y="255" class="m" fill="#2c1837" font-size="9">AI/ML ENGINEER</text><text x="300" y="299" fill="#26132d" font-size="18" font-weight="700">VARSHITH</text><text x="300" y="323" fill="#26132d" font-size="18" font-weight="700">JULAKANTI</text><text x="300" y="349" class="m" fill="#68506e" font-size="9">HYDERABAD, INDIA</text><g fill="#2b1933"><rect x="166" y="415" width="4" height="62"/><rect x="174" y="415" width="8" height="62"/><rect x="187" y="415" width="3" height="62"/><rect x="195" y="415" width="11" height="62"/><rect x="211" y="415" width="5" height="62"/><rect x="221" y="415" width="3" height="62"/><rect x="229" y="415" width="8" height="62"/><rect x="242" y="415" width="4" height="62"/><rect x="251" y="415" width="10" height="62"/><rect x="267" y="415" width="4" height="62"/><rect x="276" y="415" width="6" height="62"/></g><text x="166" y="501" class="m" fill="#7d5a78" font-size="10">ID: VJ-AIML-0105</text><text x="166" y="524" class="m" fill="#a32e73" font-size="10">● OPEN TO COLLABORATE</text><rect x="149" y="174" width="298" height="19" fill="url(#foil)" opacity=".6"><animate attributeName="y" values="174;510;174" dur="5s" repeatCount="indefinite"/></rect></g>
<g transform="translate(625 135)"><text class="m" fill="#dcbcff" font-size="12">CURRENT FOCUS / SIGNALS</text><text y="48" fill="#fff6fd" font-size="35" font-weight="700">Building the next useful thing.</text><text y="79" fill="#c7b0cc" font-size="16">A deliberate practice across intelligence, product, and systems.</text><g transform="translate(0 117)"><rect width="565" height="72" rx="16" fill="#130d1b" stroke="#71376d"/><circle cx="29" cy="36" r="7" fill="#EC4899"><animate attributeName="opacity" values="1;.35;1" dur="1.4s" repeatCount="indefinite"/></circle><text x="53" y="30" class="m" fill="#ffd0e8" font-size="12">NOW EXPLORING</text><text x="53" y="52" fill="#c8b4c9" font-size="12">Human-centred AI workflows that earn their place.</text></g><text y="236" class="m" fill="#e4caff" font-size="12">FOCUS AREAS</text><g transform="translate(0 258)"><rect width="161" height="76" rx="15" fill="#180d1e" stroke="#a83f79"/><text x="19" y="30" class="m" fill="#f8b6d8" font-size="11">01</text><text x="19" y="56" fill="#fff2fa" font-size="17" font-weight="700">AI / ML</text><rect x="178" width="188" height="76" rx="15" fill="#160d20" stroke="#744b9e"/><text x="197" y="30" class="m" fill="#ddc0ff" font-size="11">02</text><text x="197" y="56" fill="#fff2fa" font-size="17" font-weight="700">GENERATIVE AI</text><rect x="383" width="161" height="76" rx="15" fill="#180d1e" stroke="#a83f79"/><text x="402" y="30" class="m" fill="#f8b6d8" font-size="11">03</text><text x="402" y="56" fill="#fff2fa" font-size="17" font-weight="700">AI AGENTS</text></g><g transform="translate(0 376)"><rect width="565" height="51" rx="12" fill="#120c19" stroke="#59395c"/><text x="19" y="31" class="m" fill="#e4d5e6" font-size="11">BUILD · EXPERIMENT · LEARN · SHIP</text><path d="M382 26h139" stroke="url(#n)" stroke-width="3"/><circle cx="530" cy="26" r="5" fill="#C084FC"/></g></g><rect width="1280" height="600" rx="28" fill="none" stroke="#A855F7" stroke-opacity=".42"/>
