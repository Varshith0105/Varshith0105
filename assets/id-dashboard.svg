<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="t d">
<title id="t">Varshith Julakanti developer ID and dashboard</title><desc id="d">A softly swaying hanging developer ID card with Varshith's professional photograph appears next to a premium current-focus dashboard.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080710"/><stop offset="1" stop-color="#160a22"/></linearGradient><linearGradient id="n"><stop stop-color="#F472B6"/><stop offset="1" stop-color="#A855F7"/></linearGradient><linearGradient id="foil" x2="1"><stop stop-color="#fff" stop-opacity=".03"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#F472B6" stop-opacity=".04"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="20"/></filter><style>text{font-family:Arial,Helvetica,sans-serif}.m{font-family:'Courier New',monospace;letter-spacing:1.5px}.id{animation:sway 6s ease-in-out infinite;transform-origin:298px 52px}@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}@media(prefers-reduced-motion:reduce){.id{animation:none}}</style></defs>
