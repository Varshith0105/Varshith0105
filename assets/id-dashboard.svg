<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">Developer identification card and dashboard</title><desc id="desc">A hanging developer ID card uses Varshith's real professional photo next to a pink and purple profile dashboard.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070308"/><stop offset="1" stop-color="#19071d"/></linearGradient><linearGradient id="edge" x2="1"><stop stop-color="#ff4fa3"/><stop offset="1" stop-color="#9b5cff"/></linearGradient><linearGradient id="foil" x2="1"><stop stop-color="#ff8dca" stop-opacity=".1"/><stop offset=".5" stop-color="#fff" stop-opacity=".58"/><stop offset="1" stop-color="#c084fc" stop-opacity=".1"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="13"/></filter><style>text{font-family:Arial,sans-serif}.m{font-family:monospace;letter-spacing:1.6px}.card{animation:sway 5s ease-in-out infinite;transform-origin:315px 70px}@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.5deg)}}@media(prefers-reduced-motion:reduce){.card{animation:none}}</style></defs>
  <rect width="1280" height="600" rx="24" fill="url(#bg)"/><circle cx="344" cy="355" r="230" fill="#ec4899" opacity=".13" filter="url(#blur)"/><circle cx="1040" cy="315" r="240" fill="#9333ea" opacity=".12" filter="url(#blur)"/>
  <g class="card"><path d="M315 0V68" stroke="#836287" stroke-width="8"/><path d="M315 0L185 80L248 153M315 0L445 80L382 153" fill="none" stroke="#9c75a1" stroke-width="7"/><rect x="292" y="55" width="46" height="40" rx="9" fill="#eac9ea" stroke="#fff" stroke-opacity=".6"/><rect x="150" y="130" width="330" height="410" rx="22" fill="#fdf7fd" stroke="#ff67b2" stroke-width="3"/><rect x="166" y="146" width="298" height="49" rx="12" fill="#250d2b"/><text x="187" y="177" class="m" fill="#ffc4e4" font-size="13">VARSHITH // ACCESS</text><rect x="184" y="218" width="110" height="139" rx="10" fill="#180a1d"/><image href="avatar/varshith-id-photo.png" xlink:href="avatar/varshith-id-photo.png" x="184" y="218" width="110" height="139" preserveAspectRatio="xMidYMid slice"/><rect x="308" y="223" width="125" height="24" rx="12" fill="#e9c8ff"/><text x="321" y="240" class="m" font-size="10" fill="#32133e">AI/ML ENGINEER</text><text x="308" y="279" fill="#28102d" font-size="18" font-weight="700">VARSHITH</text><text x="308" y="302" fill="#28102d" font-size="18" font-weight="700">JULAKANTI</text><text x="308" y="328" class="m" font-size="10" fill="#705776">HYDERABAD, INDIA</text><g fill="#b0706f"><rect x="184" y="377" width="72" height="54" rx="7"/><path d="M196 390h48M196 405h48M212 377v54M228 377v54" stroke="#ffe1b3" stroke-width="3"/></g><g fill="#321a38"><rect x="280" y="380" width="6" height="75"/><rect x="292" y="380" width="3" height="75"/><rect x="302" y="380" width="9" height="75"/><rect x="316" y="380" width="4" height="75"/><rect x="326" y="380" width="7" height="75"/><rect x="339" y="380" width="3" height="75"/><rect x="348" y="380" width="10" height="75"/><rect x="364" y="380" width="4" height="75"/><rect x="374" y="380" width="8" height="75"/><rect x="389" y="380" width="3" height="75"/><rect x="399" y="380" width="10" height="75"/></g><text x="184" y="480" class="m" fill="#513357" font-size="11">ID: VJ-AIML-0105</text><text x="184" y="505" class="m" fill="#a03075" font-size="10">● STATUS: OPEN TO COLLAB</text><rect x="167" y="498" width="295" height="18" fill="url(#foil)" opacity=".35"><animate attributeName="x" values="167;462;167" dur="4s" repeatCount="indefinite"/></rect></g>
  <g transform="translate(670 75)"><text class="m" fill="#ff9bce" font-size="14">// DEVELOPER DASHBOARD</text><text y="37" fill="#fff4fc" font-size="27" font-weight="700">Profile at a glance</text><g transform="translate(0 68)"><rect width="550" height="64" rx="14" fill="#170a1b" stroke="#813460"/><circle cx="29" cy="32" r="8" fill="#ff4fa3"><animate attributeName="opacity" values="1;.35;1" dur="1.4s" repeatCount="indefinite"/></circle><text x="54" y="27" class="m" fill="#ffb6dc" font-size="12">AVAILABLE FOR COLLABORATION</text><text x="54" y="47" fill="#ccb5cb" font-size="11">AI · product engineering · thoughtful experiments</text></g><text y="175" class="m" fill="#d9b6ef" font-size="12">CURRENT FOCUS</text><g transform="translate(0 194)" class="m"><rect width="126" height="48" rx="12" fill="#1a0a1e" stroke="#b43880"/><text x="17" y="29" fill="#ffd0e7" font-size="12">AI / ML</text><rect x="142" width="158" height="48" rx="12" fill="#190b22" stroke="#8a52b0"/><text x="159" y="29" fill="#e8d0ff" font-size="12">GENERATIVE AI</text><rect x="316" width="120" height="48" rx="12" fill="#1a0a1e" stroke="#b43880"/><text x="334" y="29" fill="#ffd0e7" font-size="12">AI AGENTS</text></g><text y="305" class="m" fill="#d9b6ef" font-size="12">PROFILE SIGNALS</text><g transform="translate(0 326)"><rect width="550" height="48" rx="10" fill="#150916" stroke="#59315e"/><text x="18" y="30" class="m" fill="#f4d9f0" font-size="12">BUILD · LEARN · SHARE</text><path d="M372 24h138" stroke="url(#edge)" stroke-width="3"/><circle cx="518" cy="24" r="5" fill="#c084fc"/></g><text y="433" class="m" fill="#987b9d" font-size="10">PROFILE DETAILS ARE LINKED IN THE README</text></g><rect x="0" y="0" width="1280" height="600" rx="24" fill="none" stroke="#a855f7" stroke-opacity=".4"/>
</svg>
