<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-labelledby="title desc">
  <title id="title">Varshith Julakanti — Animated Profile Banner</title>
  <desc id="desc">Animated purple gradient banner for an AI/ML, Generative AI and Full-Stack Developer.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10091f">
        <animate attributeName="stop-color" values="#10091f;#281044;#10091f" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="52%" stop-color="#48166e">
        <animate attributeName="stop-color" values="#48166e;#7130a5;#48166e" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#64259a">
        <animate attributeName="stop-color" values="#64259a;#3e1670;#64259a" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="180" fill="url(#bg)"/>
  <rect width="1000" height="180" fill="url(#shine)" opacity=".6"/>
  <g fill="#ffffff">
    <circle cx="110" cy="40" r="2" opacity=".55"><animate attributeName="opacity" values=".15;.8;.15" dur="3.4s" repeatCount="indefinite"/><animate attributeName="r" values="1.5;2.7;1.5" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="855" cy="36" r="2" opacity=".5"><animate attributeName="opacity" values=".7;.15;.7" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="115" r="1.8" opacity=".45"><animate attributeName="opacity" values=".1;.65;.1" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="205" cy="130" r="1.7" opacity=".4"><animate attributeName="opacity" values=".6;.1;.6" dur="4.6s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M0 145 C190 128 330 166 520 148 S820 130 1000 162 L1000 180 L0 180 Z" fill="#0a0714" opacity=".55">
    <animate attributeName="d" values="M0 145 C190 128 330 166 520 148 S820 130 1000 162 L1000 180 L0 180 Z;M0 153 C190 166 330 132 520 154 S820 162 1000 145 L1000 180 L0 180 Z;M0 145 C190 128 330 166 520 148 S820 130 1000 162 L1000 180 L0 180 Z" dur="8s" repeatCount="indefinite"/>
  </path>
  <text x="500" y="88" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Varshith Julakanti</text>
  <text x="500" y="126" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">AI / ML  •  GENERATIVE AI  •  FULL-STACK DEVELOPER</text>
  <rect x="0" y="0" width="1000" height="3" fill="#b87aff" opacity=".8">
    <animate attributeName="opacity" values=".25;.95;.25" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
