<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="766" viewBox="0 0 1280 766" role="img" aria-label="Technology constellation used by Varshith Julakanti"><title>Technology constellation</title><desc>Three softly moving orbital rings surround a central code core and technologies organized by specialty.</desc><defs><radialGradient id="bg"><stop stop-color="#162145"/><stop offset=".5" stop-color="#090f20"/><stop offset="1" stop-color="#050812"/></radialGradient><linearGradient id="o"><stop stop-color="#44e4ff"/><stop offset="1" stop-color="#b98bff"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="6"/></filter><style>text{font-family:Arial,sans-serif}.m{font-family:monospace;letter-spacing:1.2px}.node{fill:#111b33;stroke:#5ce1ff;stroke-width:1.2}.tag{fill:#b9efff;font-size:12px}.cat{fill:#8495bd;font-size:11px;letter-spacing:2px}</style></defs><rect width="1280" height="766" fill="url(#bg)"/><text x="64" y="70" fill="#7eeaff" class="m" font-size="15">// TECH CONSTELLATION</text><text x="64" y="108" fill="#e8f4ff" font-size="26" font-weight="700">Systems I build with</text><g transform="translate(640 406)" fill="none" stroke="url(#o)"><ellipse rx="225" ry="84" stroke-opacity=".55"/><ellipse rx="325" ry="150" transform="rotate(-27)" stroke-opacity=".4"/><ellipse rx="420" ry="205" transform="rotate(24)" stroke-opacity=".28"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="22s" repeatCount="indefinite"/><circle cx="225" cy="0" r="7" fill="#55e6ff"/><circle cx="-165" cy="-55" r="5" fill="#ad8cff"/></g></g><circle cx="640" cy="406" r="96" fill="#57ddff" opacity=".13" filter="url(#g)"/><circle cx="640" cy="406" r="62" fill="#101d3b" stroke="url(#o)" stroke-width="2"/><text x="603" y="421" fill="#e8fbff" font-size="34" font-family="monospace">&lt;/&gt;</text><g class="m"><g transform="translate(167 205)"><text class="cat" y="-24">PROGRAMMING</text><rect class="node" width="116" height="32" rx="16"/><text class="tag" x="2