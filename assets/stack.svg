<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="t d">
<title id="t">Technology constellation</title><desc id="d">A pink and purple orbital system maps the programming, AI, frontend, backend, cloud and generative AI tools used by Varshith.</desc>
<defs><radialGradient id="bg"><stop stop-color="#24102e"/><stop offset=".47" stop-color="#110c1a"/><stop offset="1" stop-color="#080710"/></radialGradient><linearGradient id="n"><stop stop-color="#F472B6"/><stop offset="1" stop-color="#A855F7"/></linearGradient><filter id="b"><feGaussianBlur stdDeviation="18"/></filter><style>text{font-family:Arial,Helvetica,sans-serif}.m{font-family:'Courier New',monospace;letter-spacing:1.5px}.h{fill:#fbe9f6;font-size:13px;font-weight:700}.v{fill:#c3adc9;font-size:11px}.orbit{fill:none;stroke:#C084FC;stroke-opacity:.24}.node{fill:#120d1c;stroke:#9f4c91;stroke-width:1.2}.dot{fill:#F472B6}@media(prefers-reduced-motion:no-preference){.orbit{animation:spin 32s linear infinite;transform-origin:640px 355px}.reverse{animation-direction:reverse;animation-duration:41s}@keyframes spin{to{transform:rotate(360deg)}}}</style></defs>
<rect width="1280" height="690" rx="28" fill="url(#bg)"/><circle cx="640" cy="355" r="264" fill="#A855F7" opacity=".1" filter="url(#b)"/><text x="64" y="66" class="m" fill="#F9A8D4" font-size="13">// TECHNOLOGY CONSTELLATION</text><text x="64" y="105" fill="#fff7fd" font-size="27" font-weight="700">Tools in orbit. One purpose at the core.</text>
<g class="orbit"><ellipse cx="640" cy="367" rx="475" ry="205"/><ellipse cx="640" cy="367" rx="315" ry="268" transform="rotate(-22 640 367)"/><ellipse cx="640" cy="367" rx="198" ry="245" transform="rotate(38 640 367)"/></g><g class="orbit reverse" opacity=".7"><ellipse cx="640" cy="367" rx="400" ry="165" transform="rotate(54 640 367)"/></g>
<g transform="translate(550 277)"><circle cx="90" cy="90" r="116" fill="#EC4899" opacity=".22" filter="url(#b)"/><circle cx="90" cy="90" r="86" fill="#130d1c" stroke="url(#n)" stroke-width="3"/><circle cx="90" cy="90" r="59" fill="none" stroke="#F9A8D4" stroke-opacity=".32"/><text x="90" y="82" text-anchor="middle" class="m" fill="#F9A8D4" font-size="12">CORE</text><text x="90" y="111" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">BUILD</text></g>
<g transform="translate(104 180)"><rect class="node" width="224" height="91" rx="15"/><circle class="dot" cx="22" cy="23" r="4"/><text x="36" y="27" class="h m">PROGRAMMING</text><text x="22" y="57" class="v">Java · Python · JavaScript</text><text x="22" y="75" class="v">TypeScript</text></g>
<g transform="translate(912 160)"><rect class="node" width="250" height="109" rx="15"/><circle class="dot" cx="22" cy="23" r="4"/><text x="36" y="27" class="h m">AI / ML</text><text x="22" y="57" class="v">TensorFlow · PyTorch</text><text x="22" y="75" class="v">Scikit-learn · Pandas</text><text x="22" y="93" class="v">Deep learning systems</text></g>
<g transform="translate(106 434)"><rect class="node" width="231" height="91" rx="15"/><circle class="dot" cx="22" cy="23" r="4"/><text x="36" y="27" class="h m">FRONTEND</text><text x="22" y="58" class="v">React · Next.js</text><text x="22" y="76" class="v">TypeScript</text></g>
<g transform="translate(885 425)"><rect class="node" width="283" height="108" rx="15"/><circle class="dot" cx="22" cy="23" r="4"/><text x="36" y="27" class="h m">BACKEND / DATA</text><text x="22" y="57" class="v">Spring Boot · FastAPI · SQL</text><text x="22" y="75" class="v">MySQL · PostgreSQL</text><text x="22" y="93" class="v">Reliable APIs and data layers</text></g>
<g transform="translate(264 569)"><rect class="node" width="266" height="77" rx="15"/><circle class="dot" cx="22" cy="23" r="4"/><text x="36" y="27" class="h m">DEVOPS / CLOUD</text><text x="22" y="58" class="v">Git · GitHub · Docker · AWS</text></g><g transform="translate(750 569)"><rect class="node" width="266" height="77" rx="15"/><circle class="dot" cx="22" cy="23" r="4"/><text x="36" y="27" class="h m">GEN AI</text><text x="22" y="58" class="v">LLMs · RAG · AI Agents</text></g>
<g fill="#f9a8d4"><circle cx="375" cy="282" r="3"/><circle cx="870" cy="300" r="3"/><circle cx="410" cy="430" r="3"/><circle cx="864" cy="441" r="3"/></g><rect width="1280" height="690" rx="28" fill="none" stroke="#A855F7" stroke-opacity=".42"/>
