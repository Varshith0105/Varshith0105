<g class="rise d1"><line x1="72" y1="136" x2="104" y2="136" stroke="#c084fc"/><text class="mono" x="116" y="140" font-size="12" letter-spacing="3" fill="#c084fc">AI · ENGINEERING · IMPACT</text></g>
<text class="serif rise d2" x="68" y="230" font-size="91" font-weight="300" letter-spacing="-2" fill="#f8fafc">Varshith</text><text class="serif rise d3" x="68" y="318" font-size="91" font-style="italic" font-weight="300" letter-spacing="-2" fill="url(#name)">Julakanti<tspan fill="#c084fc">.</tspan></text>
<path d="M72 346 C250 340 440 353 610 342" fill="none" stroke="url(#rule)" stroke-width="2" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 600;600 0" dur="2s" fill="freeze"/></path>
