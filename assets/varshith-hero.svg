<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Varshith Julakanti — AI and ML developer, full-stack engineer">
<defs><radialGradient id="bg" cx="76%" cy="32%" r="85%"><stop stop-color="#4c1d95"/><stop offset=".5" stop-color="#0b1020"/><stop offset="1" stop-color="#050816"/></radialGradient><radialGradient id="glow"><stop stop-color="#8b5cf6" stop-opacity=".6"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><linearGradient id="name" x1="0" x2="1"><stop stop-color="#f8fafc"/><stop offset=".55" stop-color="#e9d5ff"/><stop offset="1" stop-color="#c084fc"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c084fc" stroke-opacity=".08"/></pattern><linearGradient id="rule"><stop stop-color="#c084fc" stop-opacity="0"/><stop offset=".35" stop-color="#c084fc"/><stop offset="1" stop-color="#e879f9" stop-opacity="0"/></linearGradient><clipPath id="clip"><rect width="1200" height="480" rx="20"/></clipPath></defs>
<style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.serif{font-family:Georgia,'Times New Roman',serif}.rise{animation:rise 1.2s cubic-bezier(.16,1,.3,1) both}.d1{animation-delay:.2s}.d2{animation-delay:.45s}.d3{animation-delay:.7s}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.rise{animation:none}}</style>
<g clip-path="url(#clip)"><rect width="1200" height="480" fill="url(#bg)"/><rect width="1200" height="480" fill="url(#grid)"/><ellipse cx="950" cy="180" rx="390" ry="280" fill="url(#glow)"><animateTransform attributeName="transform" type="translate" values="0 0;-35 18;0 0" dur="22s" repeatCount="indefinite"/></ellipse>
<g transform="translate(940 235)" opacity=".7"><circle r="190" fill="none" stroke="#c084fc" stroke-opacity=".22" stroke-dasharray="2 10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="80s" repeatCount="indefinite"/></circle><circle r="150" fill="none" stroke="#e879f9" stroke-opacity=".2"/><circle r="110" fill="none" stroke="#c084fc" stroke-opacity=".18" stroke-dasharray="4 8"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/><circle cx="150" r="5" fill="#e9d5ff"/><circle cx="-110" r="3" fill="#e879f9"/></g></g>
