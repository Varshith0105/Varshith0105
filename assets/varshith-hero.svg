<line x1="72" y1="446" x2="1128" y2="446" stroke="#c084fc" stroke-opacity=".22"/><text class="mono" x="72" y="466" font-size="10.5" letter-spacing="1.7" fill="#cbd5e1">B.TECH CSE (AI &amp; ML) · VIT-AP UNIVERSITY · CGPA 7.68</text><text class="mono" x="1128" y="466" text-anchor="end" font-size="10.5" letter-spacing="1.5" fill="#d8b4fe">AGENTIC AI · DEEP LEARNING · ROBOTICS</text><rect x=".5" y=".5" width="1199" height="479" rx="19.5" fill="none" stroke="#c084fc" stroke-opacity=".22"/></g></svg>