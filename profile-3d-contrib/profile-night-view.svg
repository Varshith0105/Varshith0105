<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Contribution city preview"><title>Contribution city</title><desc>The nightly contribution city is regenerated automatically by GitHub Actions.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#070b18"/><stop offset="1" stop-color="#17103b"/></linearGradient><linearGradient id="c" x2="1"><stop stop-color="#2de2e6"/><stop offset="1" stop-color="#9d74ff"/></linearGradient></defs><rect width="900" height="220" rx="18" fill="url(#b)"/><path d="M0 165L450 64L900 165L450 220Z" fill="#101a36" stroke="#31537b"/><g fill="#26496b" stroke="#5ee7ff" stroke-opacity=".65"><path d="M172 150v-50l28-13v53z"/><path d="M218 140V72l34-16v72z"/><path d="M279 126V44l41-19v84z"/><path d="M356 116V69l28-13v49z"/><path d="M429 104V28l52-24v82z"/><path d="M520 121V53l36-17v72z"/><path d="M589 142V82l31-14v64z"/><path d="M660 153v-48l28-13v52z"/></g><g fill="#a78bfa"><circle cx="292" cy="51" r="3"/><circle cx="454" cy="22" r="4"/><circle cx="537" cy="48" r="3"/></g><text x="40" y="45" fill="#77eaff" font-family="monospace" font-size="14" letter-spacing="2">CONTRIBUTION CITY / NIGHT VIEW</text><text x="40" y="72" fill="#8fa3c8" font-family="Arial" font-size="13">GitHub Actions will rebuild this city from live contributions.</text><rect x="40" y="94" width="176" height="3" fill="url(#c)"><animate attributeName="width" values="60;176;60" dur="2s" repeatCount="indefinite"/></rect></svg>
