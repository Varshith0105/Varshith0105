<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#365f20">
<title>Snake Quest | Varshith Julakanti</title>
<style>
:root{color-scheme:dark;--green:#a3df4f;--dark:#365f20;--blue:#2563eb;--panel:#17251a;--text:#f5f8ed}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#294321,#101b12 70%);font-family:ui-rounded,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);display:grid;place-items:center;padding:20px}
.wrap{width:min(100%,620px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}h1{font-size:clamp(1.4rem,5vw,2rem);margin:0;letter-spacing:.02em}.tag{color:#c8f28a;font-size:.78rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.stat{background:#17251a;border:1px solid #476b34;border-radius:14px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between}.stat span{color:#b9c9ad;font-size:.86rem}.stat strong{font-size:1.3rem;font-variant-numeric:tabular-nums}
.board{border:8px solid #477b2b;border-radius:9px;overflow:hidden;box-shadow:0 16px 45px #0008;background:#9cdb48}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none}
.controls{display:flex;gap:10px;margin-top:13px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer;color:#14200f;background:#c5f47b;flex:1;min-width:105px}.btn.secondary{background:#253d24;color:#edf8e7;border:1px solid #537344}.btn:focus-visible{outline:3px solid white;outline-offset:3px}.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,42px);gap:5px;justify-content:center;margin:14px auto 0}.pad button{border:1px solid #527444;background:#1b2b1b;color:white;border-radius:9px;font-size:1.2rem;touch-action:manipulation}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.hint{text-align:center;color:#b8c7b0;font-size:.84rem;line-height:1.6;margin:14px 0 0}.status{text-align:center;min-height:1.5em;margin-top:8px;color:#d7f6b1;font-weight:700}a{color:#c5f47b}
@media(min-width:560px){.pad{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main class="wrap">
<header><div><div class="tag">Varshith's mini arcade</div><h1>🐍 Snake Quest</h1></div><div aria-label="Game status">🏆 <strong id="bestBadge">0</strong></div></header>
<section class="stats" aria-label="Game statistics"><div class="stat"><span>🍎 Score</span><strong id="score">0</strong></div><div class="stat"><span>🏆 Best score</span><strong id="best">0</strong></div></section>
<div class="board"><canvas id="game" width="400" height="400" role="img" aria-label="Snake game board. Use arrow keys or WASD to move, eat apples, and avoid walls and your tail."></canvas></div>
<div class="status" id="status" aria-live="polite">Press Start to play!</div>
<div class="controls"><button class="btn" id="start">▶ Start Game</button><button class="btn secondary" id="pause">Ⅱ Pause</button><button class="btn secondary" id="restart">↻ Restart</button></div>
<div class="pad" aria-label="Touch controls"><button class="up" data-dir="up" aria-label="Move up">▲</button><button class="left" data-dir="left" aria-label="Move left">◀</button><button class="down" data-dir="down" aria-label="Move down">▼</button><button class="right" data-dir="right" aria-label="Move right">▶</button></div>
<p class="hint">Arrow keys / WASD to move · Space to pause · Eat 🍎 to score · Don't hit the wall or your tail.<br>🏆 Trophy counter saves your all-time apples on this browser.</p>
<p class="hint"><a href="https://github.com/Varshith0105">← Back to GitHub profile</a></p>
</main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),N=20,C=20;
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),badge=document.getElementById('bestBadge'),status=document.getElementById('status'),startBtn=document.getElementById('start'),pauseBtn=document.getElementById('pause');
let snake,dir,next,apple,score,best,active=false,over=false,loop=null;
try{best=Number(localStorage.getItem('snakeQuestBest')||0)}catch{best=0}
function reset(){snake=[{x:7,y:10},{x:6,y:10},{x:5,y:10},{x:4,y:10}];dir={x:1,y:0};next={...dir};score=0;over=false;active=false;placeApple();updateStats();draw();status.textContent='Ready when you are — press Start!';startBtn.textContent='▶ Start Game';clearInterval(loop);loop=null}
function placeApple(){let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake?.some(s=>s.x===p.x&&s.y===p.y));apple=p}
function updateStats(){scoreEl.textContent=score;bestEl.textContent=best;badge.textContent=best}
function draw(){ctx.clearRect(0,0,400,400);
for(let y=0;y<N;y++)for(let x=0;x<N;x++){ctx.fillStyle=(x+y)%2===0?'#a9e653':'#9edb49';ctx.fillRect(x*C,y*C,C,C)}
// apple and leaf
ctx.fillStyle='#e83b2e';ctx.beginPath();ctx.arc(apple.x*C+10,apple.y*C+11,7.1,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3e8c35';ctx.beginPath();ctx.ellipse(apple.x*C+13,apple.y*C+3,4,2.2,-.6,0,Math.PI*2);ctx.fill();
snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#1d4ed8':'#2563eb';roundRect(p.x*C+1,p.y*C+2,18,17,5);if(i===0){const ex=dir.x===1?13:dir.x===-1?5:dir.x===0?6:6,ey=dir.y===1?13:dir.y===-1?5:6;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x*C+ex,p.y*C+ey,3.1,0,7);ctx.fill();ctx.fillStyle='#10254d';ctx.beginPath();ctx.arc(p.x*C+ex+dir.x*.8,p.y*C+ey+dir.y*.8,1.5,0,7);ctx.fill();const ex2=dir.x===1?13:dir.x===-1?5:14,ey2=dir.y===1?13:dir.y===-1?5:13;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x*C+ex2,p.y*C+ey2,2.6,0,7);ctx.fill();ctx.fillStyle='#10254d';ctx.beginPath();ctx.arc(p.x*C+ex2+dir.x*.8,p.y*C+ey2+dir.y*.8,1.3,0,7);ctx.fill()}})
if(!active&&!over){ctx.fillStyle='#203b15aa';ctx.fillRect(0,0,400,400);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 22px system-ui';ctx.fillText('SNAKE QUEST',200,184);ctx.font='14px system-ui';ctx.fillText('Press Start to begin',200,211)}
if(over){ctx.fillStyle='#203b15b8';ctx.fillRect(0,0,400,400);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 25px system-ui';ctx.fillText('GAME OVER',200,185);ctx.font='15px system-ui';ctx.fillText('Score: '+score+'  •  Press Restart',200,213)}
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function tick(){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some((p,i)=>i<snake.length-1&&p.x===h.x&&p.y===h.y)){end();return}snake.unshift(h);if(h.x===apple.x&&h.y===apple.y){score++;if(score>best){best=score;try{localStorage.setItem('snakeQuestBest',String(best))}catch{}}placeApple();updateStats()}else snake.pop();draw()}
function begin(){if(over)reset();if(active)return;active=true;status.textContent='Go! Grab the apples 🍎';startBtn.textContent='▶ Resume';clearInterval(loop);loop=setInterval(tick,Math.max(75,145-score*2));draw()}
function end(){active=false;over=true;clearInterval(loop);loop=null;startBtn.textContent='▶ Play Again';status.textContent='Game over — you scored '+score+'. Try again!';draw()}
function togglePause(){if(over)return;if(active){active=false;clearInterval(loop);loop=null;startBtn.textContent='▶ Resume';status.textContent='Paused';draw()}else begin()}
function turn(d){const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[d];if(!m||m.x===-dir.x&&m.y===-dir.y)return;next=m;if(!active&&!over){dir=m;next=m;draw()}}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),map={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};if(map[k]){e.preventDefault();turn(map[k])}else if(k===' '){e.preventDefault();togglePause()}else if(k==='enter'&&!active)begin()});
document.querySelectorAll('[data-dir]').forEach(b=>{b.addEventListener('click',()=>turn(b.dataset.dir));});
startBtn.addEventListener('click',begin);pauseBtn.addEventListener('click',togglePause);document.getElementById('restart').addEventListener('click',reset);
reset();
})();
</script>
</body></html>
